<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="data:,">
<script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkSphere - Employee Management System</title>
    <meta name="description" content="WorkSphere - Advanced real-time employee directory with role-based authentication, analytics, and modern UI" />
    <meta name="author" content="WorkSphere Team" />

    <!-- Fonts with swap for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />



    <!-- Loading Styles -->
    <style>
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.8s ease-out;
      }

      .loading-content {
        text-align: center;
        color: white;
      }

      .loading-icon {
        font-size: 5rem;
        animation: float 2s ease-in-out infinite;
        margin-bottom: 2rem;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(-10px) rotate(-5deg); }
        50% { transform: translateY(-15px) rotate(0deg); }
        75% { transform: translateY(-10px) rotate(5deg); }
      }

      .loading-text {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #fff, #e0e7ff);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 2s infinite;
      }

      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      .loading-subtitle {
        font-size: 1.1rem;
        opacity: 0.9;
        animation: pulse 1.5s infinite;
      }

      .loading-dots {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
        margin-top: 20px;
      }

      .loading-dots div {
        position: absolute;
        top: 33px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        animation-timing-function: cubic-bezier(0, 1, 1, 0);
      }

      .loading-dots div:nth-child(1) {
        left: 8px;
        animation: dots1 0.6s infinite;
      }

      .loading-dots div:nth-child(2) {
        left: 8px;
        animation: dots2 0.6s infinite;
      }

      .loading-dots div:nth-child(3) {
        left: 32px;
        animation: dots2 0.6s infinite;
      }

      .loading-dots div:nth-child(4) {
        left: 56px;
        animation: dots3 0.6s infinite;
      }

      @keyframes dots1 {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
      }

      @keyframes dots3 {
        0% { transform: scale(1); }
        100% { transform: scale(0); }
      }

      @keyframes dots2 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(24px, 0); }
      }
    </style>
  </head>

  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen" role="alert" aria-live="polite">
      <div class="loading-content">
        <div class="loading-icon" aria-hidden="true">🌐</div>
        <div class="loading-text" role="heading" aria-level="1">WorkSphere</div>
        <div class="loading-subtitle">Initializing your workspace...</div>
        <div class="loading-dots">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <!-- Graceful Fallback for No JS -->
    <noscript>
      <style>
        #root, .loading-screen { display: none; }
        body::before {
          content: "JavaScript is disabled. Please enable it to use WorkSphere.";
          display: block;
          padding: 2rem;
          font-size: 1.5rem;
          color: #fff;
          background: #333;
          text-align: center;
        }
      </style>
    </noscript>

    <!-- App JS -->
    <script>
      window.addEventListener('load', () => {
        const randomDelay = Math.random() * 1000 + 2000; // 2–3 seconds
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 800);
          }
        }, randomDelay);
      });
    </script>

    <!-- Vite/React Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
